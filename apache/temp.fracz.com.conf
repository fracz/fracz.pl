<VirtualHost *:8080>
    ServerName temp.fracz.com
    DocumentRoot /var/www/temp

    <Directory /var/www/temp>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/temp.fracz.com-error.log
    CustomLog ${APACHE_LOG_DIR}/temp.fracz.com-access.log combined
</VirtualHost>
